<!--
  Source of the README banner and the social preview image. Original artwork, no game assets.
  Palette: white, black, blues and gold only. Font: Monocraft (SIL Open Font License,
  https://github.com/IdreesInc/Monocraft), which must be installed on the machine that renders.

  Redraw with Chrome, at twice the size for sharp edges:
    google-chrome --headless=new --hide-scrollbars --default-background-color=00000000 \
      --force-device-scale-factor=2 --virtual-time-budget=5000 --window-size=1280,400 \
      --screenshot=banner.png "file://$PWD/banner.html?kind=banner"
  Use kind=social with --window-size=1280,640 for the social preview. Then save the banner
  as WebP and scale the social preview to 1280x640 (GitHub's limit is 1 MB).
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --white: #ffffff;
    --ink: #0a0f1f;
    --night: #0b1a45;
    --blue: #1d4ed8;
    --blue-soft: #dbe5ff;
    --blue-faint: #eef3ff;
    --gold: #f2b300;
    --gold-deep: #c98d00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  .card {
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h); border-radius: var(--r);
    background: var(--white);
    border: 2px solid var(--blue-soft);
    font-family: 'Monocraft', monospace;
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(var(--blue-soft) 1.6px, transparent 1.8px);
    background-size: 24px 24px; background-position: 12px 12px;
    -webkit-mask-image: radial-gradient(70% 120% at 100% 50%, #000 0%, transparent 70%);
            mask-image: radial-gradient(70% 120% at 100% 50%, #000 0%, transparent 70%);
  }
  .social .grid {
    -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, transparent 30%, #000 100%);
            mask-image: radial-gradient(60% 60% at 50% 50%, transparent 30%, #000 100%);
    opacity: .7;
  }
  .content {
    position: absolute; inset: 0; display: flex; align-items: center; gap: var(--gap);
    padding: 0 var(--pad);
  }
  .social .content { flex-direction: column; justify-content: center; text-align: center; }
  svg.pixels { shape-rendering: crispEdges; display: block; }
  .mark { width: var(--mark); flex: none; }
  h1 { font-weight: 700; font-size: var(--word); line-height: 1; color: var(--ink); letter-spacing: -0.01em; }
  .tag { margin-top: var(--tag-gap); font-size: var(--tag); font-weight: 400; color: var(--blue); }
  .url {
    display: inline-flex; align-items: center; gap: 14px; margin-top: var(--url-gap);
    font-size: var(--url); font-weight: 600; color: var(--ink);
    padding: 10px 18px; border: 2px solid var(--blue-soft); border-radius: 12px; background: var(--white);
  }
  .url i { width: 12px; height: 12px; background: var(--gold); box-shadow: 0 0 0 2px var(--white), 0 0 0 4px var(--gold-deep); }
  .sparkles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="grid"></div>
  <svg class="sparkles pixels" id="sparkles"></svg>
  <div class="content">
    <svg class="mark pixels" id="mark" aria-hidden="true"></svg>
    <div>
      <h1>Dreamports</h1>
      <p class="tag">Enhanced fan ports of classic games</p>
      <span class="url"><i></i>dreamports.net</span>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const kind = params.get('kind') || 'banner';
  const sizes = {
    banner: { w: 1280, h: 400, r: 28, gap: 64, pad: 112, mark: 165, word: 116, tag: 30, 'tag-gap': 18, url: 22, 'url-gap': 28 },
    social: { w: 1280, h: 640, r: 0, gap: 40, pad: 80, mark: 150, word: 128, tag: 34, 'tag-gap': 20, url: 24, 'url-gap': 30 },
  }[kind];
  const card = document.getElementById('card');
  for (const [k, v] of Object.entries(sizes)) card.style.setProperty('--' + k, v + 'px');
  if (kind === 'social') card.classList.add('social');

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const palette = { B: css('--blue'), N: css('--night'), G: css('--gold'), D: css('--gold-deep'), W: css('--white') };
  const draw = (svg, rows, cell, x0 = 0, y0 = 0) => {
    rows.forEach((row, y) => [...row].forEach((c, x) => {
      if (!palette[c]) return;
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', x0 + x * cell); r.setAttribute('y', y0 + y * cell);
      r.setAttribute('width', cell); r.setAttribute('height', cell); r.setAttribute('fill', palette[c]);
      svg.appendChild(r);
    }));
  };

  // A doorway (the "port") opening onto a night sky with a golden star (the "dream").
  const doorway = [
    '....BBBBBBB....',
    '..BBNNNNNNNBB..',
    '.BNNNNNNNNNNNB.',
    '.BNNNNNGNNNNNB.',
    'BNNWNNNGNNNNNNB',
    'BNNNNGGGGGNNNNB',
    'BNNNNNNGNNNNWNB',
    'BNNNNNNGNNNNNNB',
    'BNNNNNNNNNNNNNB',
    'BNWNNNNNNNNNNNB',
    'BNNNNNNNNNNWNNB',
    'BNNNNNNNNNNNNNB',
    'BNNNNNNDNNNNNNB',
    'BNNNNNNDNNNNNNB',
    'BNNNNNDDDNNNNNB',
    'BNNNNDDDDDNNNNB',
    'BNNNDDDDDDDNNNB',
    'BBBBBBBBBBBBBBB',
  ];
  const mark = document.getElementById('mark');
  mark.setAttribute('viewBox', '0 0 15 18');
  mark.style.height = (sizes.mark * 18 / 15) + 'px';
  draw(mark, doorway, 1);

  // A few pixel sparkles, gold and blue.
  const sparkle = ['..G..', '..G..', 'GGGGG', '..G..', '..G..'];
  const small = ['.B.', 'BBB', '.B.'];
  const sparkles = document.getElementById('sparkles');
  const spots = kind === 'social'
    ? [[sparkle, 6, 150, 110], [small, 6, 1090, 120], [sparkle, 5, 1110, 520], [small, 5, 210, 500], [small, 4, 1150, 300]]
    : [[sparkle, 6, 1130, 70], [small, 6, 1040, 300], [small, 4, 1190, 200]];
  for (const [shape, cell, x, y] of spots) draw(sparkles, shape, cell, x, y);
</script>
</body>
</html>
