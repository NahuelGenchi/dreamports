<!--
  Source of the README banner and the social preview image. Original artwork, no game assets.
  The mark is public/images/mark.svg (#1143). Fonts: Quicksand for the name, loaded from Google Fonts, and Monocraft
  for the rest (both SIL Open Font License; Monocraft, https://github.com/IdreesInc/Monocraft, must be installed on
  the machine that renders).

  Redraw with Chrome, at twice the size for sharp edges:
    google-chrome --headless=new --hide-scrollbars --default-background-color=00000000 \
      --force-device-scale-factor=2 --virtual-time-budget=5000 --window-size=1280,400 \
      --screenshot=banner.png "file://$PWD/banner.html?kind=banner"
  For the social preview use kind=social, --window-size=1280,640 and --force-device-scale-factor=1
  (GitHub wants 1280x640 under 1 MB), and copy it to public/images/social-preview.png too. Save the banner as
  lossless WebP.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --navy: #0a3a78;
    --blue: #1a4fb0;
    --sky-pale: #ddefff;
    --line: #cde3f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  .card {
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h); border-radius: var(--r);
    background: radial-gradient(900px 560px at 50% 0, var(--sky-pale), rgba(221, 239, 255, 0) 80%), var(--white);
    border: 2px solid var(--line);
    font-family: 'Monocraft', monospace;
    -webkit-font-smoothing: antialiased;
  }
  .content {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: var(--gap);
    padding: 0 var(--pad);
  }
  .mark { width: var(--mark); height: var(--mark); flex: none; display: block; }
  h1 {
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: var(--word); line-height: 1;
    color: var(--blue);
  }
  .tag { margin-top: var(--tag-gap); font-size: var(--tag); font-weight: 400; color: var(--blue); }
  .url {
    display: inline-flex; align-items: center; gap: 12px; margin-top: var(--url-gap);
    font-size: var(--url); font-weight: 600; color: var(--navy);
    padding: 10px 18px; border: 2px solid var(--line); border-radius: 12px; background: var(--white);
  }
  .url img { width: calc(var(--url) * 1.2); height: calc(var(--url) * 1.2); display: block; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="content">
    <img class="mark" src="../../public/images/mark.svg" alt="">
    <div>
      <h1>dreamports</h1>
      <p class="tag">Enhanced fan ports of classic games</p>
      <span class="url"><img src="../../public/favicon.svg" alt="">dreamports.net</span>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const kind = params.get('kind') || 'banner';
  const sizes = {
    banner: { w: 1280, h: 400, r: 28, gap: 44, pad: 80, mark: 280, word: 96, tag: 26, 'tag-gap': 18, url: 20, 'url-gap': 26 },
    social: { w: 1280, h: 640, r: 0, gap: 48, pad: 64, mark: 360, word: 108, tag: 28, 'tag-gap': 22, url: 22, 'url-gap': 32 },
  }[kind];
  const card = document.getElementById('card');
  for (const [k, v] of Object.entries(sizes)) card.style.setProperty('--' + k, v + 'px');
</script>
</body>
</html>
