body:
  - type: markdown
    attributes:
      value: |
        Each game has one progress thread, where everyone working on it posts each step: what changed, a clip, the % and a link to a preview. `npm run dp -- share <game> --post` posts in it, and opens the game's thread if it has none yet, so you rarely need this form.

        Check first that the game has no thread here yet. A second thread for the same game is closed by itself, with a link to the first. [Previews and progress threads](https://github.com/NahuelGenchi/dreamports/blob/main/docs/PREVIEWS.md) explains the rest.
  - type: input
    id: game
    attributes:
      label: Game folder
      description: The game's folder in games/, which is also its address on dreamports.net. Lowercase letters, numbers and single dashes.
      placeholder: sonic-advance
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: About the game
      description: A sentence or two about the game and its Dreamport.
    validations:
      required: true
