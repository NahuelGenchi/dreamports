name: Mac and Windows (NES)

# The NES's proof tools on a Mac and on Windows, as a person making a Dreamport on one has them, on GitHub's own
# computers, as the Game Boy Advance's workflow tries that console's (gba.yml): a Mac with Apple's chip, got ready as
# tools/README.md has it, with Homebrew's Node.js and CMake, and Windows with only git and Node.js. Each runs
# test:nes-twin, the function check, which builds a program of its own each time it runs: with Apple's compiler on a
# Mac, and on Windows with w64devkit's, which the tools get once and keep (#1957). GitHub's Windows has a gcc of its
# own on the PATH, which a person's seldom has, so that job takes it off the PATH first, and the tools get their own.
# Then each builds the NES's reference emulator, FCEUmm, from its makers' source, as setup does on a person's computer,
# and runs test:real-console, which proves a program of the project's own on it in the computer's own browser (#1967).
# Linux runs it in Check. Nothing from any game's copy is needed, and nothing is sent anywhere.
#
# Each also runs test:part-tasks, a game whose parts are its tasks, as far as the NES's tools reach (#1970).
#
# It isn't part of Check, as a Mac and Windows take longer to start and build. It runs on pull requests that touch
# what those tools are made of, after they merge, every week, and by hand.
on:
  pull_request:
    paths:
      - '.github/workflows/nes.yml'
      - '.node-version'
      - '.npmrc'
      - 'kit/c/console.c'
      - 'kit/c/disc.c'
      - 'kit/c/disc.h'
