  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fails a pull request that one above it in a stack carries, so none of the jobs after it starts (.github/stack/stack.mjs)
  stack:
    name: Stack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/stack
      - name: Stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/stack/stack.mjs

  mac:
    name: Mac (NES)
    needs: stack
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # what a person's Mac has or installs: Apple's command line tools give git and the C compiler, Homebrew gives
      # Node.js and CMake
      - name: Getting ready on a Mac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          xcode-select -p
          cc --version | head -1
          git --version
          brew install --quiet node cmake
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: The tools' packages
        run: |
          test "$(command -v node)" = "$(brew --prefix)/bin/node"
          node --version
          npm ci
      # it builds the emulator itself, as prove does the first time it needs it
      - run: npm run test:part-tasks -- nes
      - run: npm run test:nes-twin
      - run: npm run dp -- setup nes
      - run: npm run test:real-console

  windows:
    name: Windows (NES)
    needs: stack
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Windows has or installs: git and Node.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      # it builds the emulator itself, as prove does the first time it needs it, with GitHub's own gcc for the function check
      - run: npm run test:part-tasks -- nes
      # no compiler of the computer's own, as on most people's Windows: the tools get their own
      - name: No gcc on the PATH
        shell: pwsh
        run: |
          $kept = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'gcc.exe')) }) -join ';'
          "PATH=$kept" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The tools get their own compiler
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { throw 'gcc is still on the PATH' }
          npm run test:nes-twin
          if (-not (Test-Path "$env:ProgramData\dreamports-compiler\w64devkit\bin\gcc.exe")) { throw 'the tools kept no compiler' }
      - run: npm run dp -- setup nes
      - run: npm run test:real-console
