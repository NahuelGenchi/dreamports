      - 'tools/libretro/ran.h'
      - 'tools/libretro/reference.mjs'
      - 'tools/libretro/starts.h'
      - 'tools/match.mjs'
      - 'tools/nes/**'
      - 'tools/new.mjs'
      - 'tools/play.mjs'
      - 'tools/proofs.mjs'
      - 'tools/prove.mjs'
      - 'tools/read.mjs'
      - 'tools/ready.mjs'
      - 'tools/rom.mjs'
      - 'tools/setup.mjs'
