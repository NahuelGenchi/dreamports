name: First entry

# A new game's first two pull requests come in with no review of their code (docs/TEAMS.md). Its first files, only what
# npm run dp -- new writes for the game its author has claimed: the reading job writes all of it again and compares, with
# a token that can only read, and as they hold no picture, the acting job merges that very commit once the pull request's
# checks have passed, which the run that follows the Check workflow sees, and then starts the workflow that puts the
# game's progress map in its issue. Then its card, only what npm run dp -- capture writes: the bot asks about the capture,
# the one thing only a person can check, in a comment with a box to tick, and ticking it runs this again and merges that
# very commit. Neither job runs anything from the pull request: they check out this repository's own code, and read the
# pull request's through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [edited]
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions: {}

concurrency:
  group: first-entry-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  read:
    name: Read the first entry
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
      || (github.event.issue.pull_request && github.event.comment.user.login == 'github-actions[bot]'
        && startsWith(github.event.comment.body, '<!-- first-entry') && github.event.sender.login != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    outputs:
      plan: ${{ steps.read.outputs.plan }}
    steps:
      - name: Check out this repository, never a pull request's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
      - run: npm ci --ignore-scripts
      - name: Read it, and write it again to compare
        id: read
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/first-entry/read.mjs

  act:
    name: Say so, or merge
    needs: read
    if: needs.read.outputs.plan != '' && !contains(needs.read.outputs.plan, '"kind":"none"')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # to start the Issue maps workflow once a game's first files are on main, as a merge made here starts no run of it
      actions: write
    steps:
      - name: Check out the bot, never a pull request's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Carry out the plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.read.outputs.plan }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/first-entry/act.mjs
