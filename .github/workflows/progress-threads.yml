name: Progress threads

# One open thread per game in the Progress category of Discussions (docs/PREVIEWS.md). A thread names its game in
# its "Game folder" field. A thread without a game, or one that takes a game another open thread already has, is
# answered with a link to the right place, closed and locked. Nothing from the thread is run: its text is only read.
on:
  discussion:
    types: [created, edited, category_changed]

permissions:
  discussions: write

concurrency:
  group: progress-threads
  cancel-in-progress: false

jobs:
  one-per-game:
    name: One open thread per game
    if: github.event.discussion.category.slug == 'progress'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Close threads without a game, and second threads for a game
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const [owner, name] = process.env.GITHUB_REPOSITORY.split('/');
          async function graphql(query, variables) {
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST', signal: AbortSignal.timeout(30000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables })
            });
            const out = await response.json();
            if (!response.ok || out.errors) throw new Error(`GitHub GraphQL: HTTP ${response.status} ${JSON.stringify(out.errors ?? '')}`);
            return out.data;
          }

          // the game a thread is for: its "Game folder" field, as the category's form and share write it
          const NAME = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
          function gameOf(body) {
            const game = /^###\s*Game folder\s*\n+\s*`?([^\n`]+)`?\s*$/m.exec(body ?? '')?.[1].trim();
            return game && NAME.test(game) ? game : null;
          }

          const { repository } = await graphql(`query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) { discussion(number: $number) { id url closed body category { id slug } } }
          }`, { owner, name, number: event.discussion.number });
          const thread = repository.discussion;
          if (!thread || thread.closed || thread.category.slug !== 'progress') process.exit(0);
          const game = gameOf(thread.body);
          // an edit only matters when it changes the game
          if (event.action === 'edited' && (event.changes?.body?.from === undefined || gameOf(event.changes.body.from) === game)) {
            console.log(`#${event.discussion.number}: edited, still ${game ?? 'without a game'}.`);
            process.exit(0);
          }

          let first = null;
          if (game) {
            for (let after = null; ;) {
              const { repository: { discussions } } = await graphql(`query($owner: String!, $name: String!, $category: ID!, $after: String) {
                repository(owner: $owner, name: $name) {
                  discussions(first: 100, after: $after, categoryId: $category, orderBy: { field: CREATED_AT, direction: ASC }) {
                    nodes { id url closed body }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }`, { owner, name, category: thread.category.id, after });
              first = discussions.nodes.find(t => t.id !== thread.id && !t.closed && gameOf(t.body) === game) ?? null;
              if (first || !discussions.pageInfo.hasNextPage) break;
              after = discussions.pageInfo.endCursor;
            }
            if (!first) {
              console.log(`#${event.discussion.number}: the thread for ${game}.`);
              process.exit(0);
            }
          }

          const answer = first
            ? `${game} already has a progress thread: ${first.url}. Each game has one, so this one is closed. Please post there instead.`
            : 'Each thread in Progress is one game\'s, and names the game\'s folder in games/ under "Game folder", such as sonic-advance. '
              + 'This one doesn\'t, so it\'s closed. `npm run dp -- share <game> --post` posts in a game\'s thread, and opens it if there\'s none yet: '
              + 'https://github.com/NahuelGenchi/dreamports/blob/main/docs/PREVIEWS.md explains how.';
          await graphql(`mutation($id: ID!, $body: String!) { addDiscussionComment(input: { discussionId: $id, body: $body }) { clientMutationId } }`, { id: thread.id, body: answer });
          await graphql(`mutation($id: ID!, $reason: DiscussionCloseReason!) { closeDiscussion(input: { discussionId: $id, reason: $reason }) { clientMutationId } }`,
            { id: thread.id, reason: first ? 'DUPLICATE' : 'OUTDATED' });
          await graphql(`mutation($id: ID!) { lockLockable(input: { lockableId: $id }) { clientMutationId } }`, { id: thread.id });
          console.log(`#${event.discussion.number}: closed, ${first ? `as ${game} already has ${first.url}` : 'as it names no game'}.`);
          NODE
