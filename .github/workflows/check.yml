name: Check

# Every pull request gets the checks anyone can run: npm run check, the site's build, and npm run test:game, which tries
# what every new game starts with in a real browser, with a made-up cartridge, so nothing from any game is needed,
# npm run test:c-kit, which tries the kit in C against the JavaScript kit's drawing and starting point, and
# npm run test:consoles and test:real-console, which do the same on a made-up console and on a real NES emulator, built
# from its makers' source, with a small program of the project's own, and say which of its functions ran, and
# npm run test:ps1-kit, which proves the PlayStation's kit in C against its real emulator with another, and
# npm run test:ps1-memories, which takes memories of play in that emulator for the function check, and npm run test:match, which builds the Game Boy
# Advance's compiler from its keepers' source and tries match with another small program of the project's own, and
# npm run test:nes-twin, which tries the NES's function check on the real emulator's own processor with a third, and
# npm run test:ps1-call and test:ps1-twin, which run the functions of a fourth in the PlayStation's emulator's own
# interpreter and check its twins against them, and npm run test:ps1-gcc, which builds the PlayStation's compiler from
# GNU's source as WebAssembly and compiles a C file of the project's own with it, and npm run test:ps1-match, which
# tries match on the PlayStation with a fifth, against a PS-X EXE it lays out itself, and npm run test:ps2-call and
# test:ps2-twin, which run the functions of a sixth in Play!'s own processors and check its twins against them, and
# test:ps2-twin-programs, which does the same for a made-up disc's IOP module and second EE program, and
# npm run test:snes-call, which runs the functions of a seventh, a Super Nintendo cartridge, in Snes9x's own 65816,
# npm run test:real-snes, which plays it in Snes9x, built with the tools' change to it, maps its code and reads it,
# and reads the program a ninth gives the sound processor, npm run test:snes-twin, which checks its twins against it,
# npm run test:snes-kit, which proves the Super Nintendo's kit in C against Snes9x with programs of the project's own,
# npm run test:n64-call and test:n64-twin, which run the functions of an eighth in Parallel N64's own processor and
# check its twins against them, and npm run test:n64-match, which builds IDO from its translation's source and tries
# match on the Nintendo 64 with a tenth, and npm run test:n64-kit, which proves the Nintendo 64's kit in C against
# Parallel N64 with an eleventh, its RSP's microcodes and every sum of its vector unit among it, and
# npm run test:real-gb, which proves the Game Boy's and the Game Boy Color's kit in C against Gambatte with a twelfth,
# every pixel and every sample of its sound, and npm run test:gb-twin, which tries the Game Boy's function check on
# Gambatte's own processor with a thirteenth, and npm run test:gamecube-codemap, which makes, names and reads the code
# map of a fourteenth, a GameCube disc. A pull request's code runs here, with a token that can only read and no
# secrets.
#
# The tests run in fourteen jobs side by side, as one after another they came near the 15-minute limit (#1503, #1558, #1695,
# #1742, #1744), the Super Nintendo's kit in two of them (#1641). The check main requires, and the Readme workflow and
# the first-entry bot read, is the last job, Check, which passes only when all fourteen have.
on:
  pull_request:

permissions:
  contents: read

# a new push cancels the pull request's older run, as only the newest commit's checks count for a merge (#2011)
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Check (${{ matrix.part }})
    runs-on: ubuntu-24.04
    # 15 minutes a part, but one that says it needs more
    timeout-minutes: ${{ matrix.minutes || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the site: its build, and a new game's start in a real browser; and the Nintendo 64's kit, proven against
          # Parallel N64, which this job builds, as it has the time to
          - part: site
            run: |
              npm run check
              npm run build
              npm run test:game
              npm run test:n64-kit
          # the kits and the consoles' emulators, and the Nintendo 64's function check, here as the functions job is near
          # its time
          - part: consoles
            run: |
              npm run test:c-kit
              npm run test:consoles
              npm run test:real-console
              npm run test:ps1-memories
              npm run test:n64-twin
          # the Super Nintendo: its processor running one function at a time, its emulator saying what ran for the code
          # map, its function check, and the first half of its kit's programs, proven against Snes9x
          - part: snes
            run: |
              npm run test:snes-call
              npm run test:real-snes
              npm run test:snes-twin
              npm run test:snes-kit -- --half 1
          # the second half of the Super Nintendo kit's programs, beside the first
          - part: snes kit
            run: npm run test:snes-kit -- --half 2
          # the function check, with a small program of the project's own built into a made-up cartridge, which mGBA
          # runs; match and the NES's function check; the whole cartridge rebuilt and every byte of it accounted for,
          # with another program of the project's own laid out as a linker lays it; and test:same-memory, which builds a
          # program of the project's own as a cartridge and as a Dreamport from the same C, and has prove find every
          # frame and the whole work memory the same in mGBA and in a browser (tools/README.md); and an NES library of
          # the project's own, found in a second made-up program by its short hash and proven there; and the GBA kit's
          # clock, measured against mGBA an instruction at a time on a made-up program's power-on; and the console's
          # stack in a Dreamport, which has to leave the same words as mGBA where a later function reads them unset;
          # and the kit as the sound hardware of a game that runs the sound engine itself
          - part: functions
            run: |
              npm run test:twin
              npm run test:clock
              npm run test:stack
              npm run test:sound-console
              npm run test:match
              npm run test:rebuild
              npm run test:nes-twin
              npm run test:n64-call
              npm run test:same-memory
              npm run test:nes-libraries
          # the PlayStation's function check, its compiler and match, and a PlayStation library of the project's own,
          # found in a second program by building it with GCC 2.7.2 and by its short hash; they took half of the part
          # above when they ran in it, close to the 15-minute limit (#1742)
          - part: ps1
            run: |
              npm run test:ps1-call
              npm run test:ps1-twin
              npm run test:ps1-gcc
              npm run test:ps1-match
              npm run test:ps1-libraries
          # the PlayStation's kit in C, proven against PCSX ReARMed with programs of the project's own; it ran in the
          # consoles part until its second program took that part past its 15 minutes (#1558)
          - part: ps1 kit
            run: npm run test:ps1-kit
          # a game made a function at a time, with the same program: match and twin keep each proof, and its tasks go by
          # them; a big game's tasks of functions, each under its stretch's issue, and no issue past what GitHub holds
          # under one; and a shared library of the project's own, proven in two made-up games at addresses of their own;
          # and match on the Nintendo 64, with IDO built from its translation's source
          - part: tasks
            run: |
              npm run test:function-tasks
              npm run test:function-homes
              npm run test:libraries
              npm run test:n64-match
          # a game whose parts are its tasks, from its first day to its last task done, through the tools as they're
          # typed, with a program of the project's own on the Game Boy Advance and a stand-in for GitHub: prove's list
          # of each part held to what the program is known to run, and ready --task failing until each function has
          # its proof and the part's frames are the same. In a job of its own, as ready checks and builds the site three
          # times, near 20 minutes on a busy computer
          - part: part tasks
            minutes: 30
            run: npm run test:part-tasks -- gba
          # the same on the NES, with its program's Dreamport on the NES kit and its functions proven by the function check,
          # as far as the NES's tools reach (#1958), in a part of its own beside the Game Boy Advance's
          - part: part tasks nes
            minutes: 25
            run: npm run test:part-tasks -- nes
          # the PlayStation 2, in a job of its own as it took tasks near the 15-minute limit (#1695): Sony's own
          # compiler and assemblers, built from Sony's GPL source with the runner's clang, kept only if they make the
          # original compiler's objects, the tools' tables checked against them, and match on the console against a
          # program of the project's own that Sony's compiler and linker made; and its function check, with Play!'s own
          # processors built from its makers' source and a made-up program's functions run on each of them and checked
          # against their twins
          - part: ps2
            run: |
              npm run test:ps2-gcc
              npm run test:ps2-match
              npm run test:ps2-call
              npm run test:ps2-twin
          # the Game Boy and the Game Boy Color: their kit in C, proven against Gambatte with a program of the project's
          # own as a game of each, every frame, and then every pixel and every sample of its sound; and their function
          # check, with Gambatte's own processor built from its makers' source and another program's functions run on
          # it and checked against their twins
          - part: game boy
            run: |
              npm run test:real-gb
              npm run test:gb-twin
          # the PlayStation 2's function check on the programs a disc has beside the one it boots, an IOP module, a second
          # program for the EE and vector unit 1's programs, in a job of its own as with it the part above took 8 to 12 of
          # its 15 minutes (#1744); it builds Play!'s processors and Sony's compiler again for itself
          - part: ps2 programs
            run: npm run test:ps2-twin-programs
          # the GameCube, as far as it goes with no emulator, which takes most of an hour to build and has a workflow of
          # its own: a made-up disc's code map, made, named and read through the tools as they're typed (#1944)
          - part: gamecube
            run: npm run test:gamecube-codemap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      # OpenGL's headers, which Parallel N64's source includes though nothing of them is linked
      - if: matrix.part == 'site'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libgl-dev
      - run: ${{ matrix.run }}

  # Nothing public credits a coding agent (AGENTS.md): the pull request's title, its description and its commits'
  # messages, read as text and never run
  credit:
    name: Check (credit)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: No commit or text of it credits a coding agent
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: origin/${{ github.base_ref }}
        # the check as main has it, so a pull request can't change what reads it, and its own where main has none yet
        run: |
          git show "$BASE:.github/credit/credit.mjs" > "$RUNNER_TEMP/credit.mjs" 2>/dev/null || cp .github/credit/credit.mjs "$RUNNER_TEMP/credit.mjs"
          node "$RUNNER_TEMP/credit.mjs" "$BASE"

  check:
    name: Check
    needs: [tests, credit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.tests.result }}
          CREDIT: ${{ needs.credit.result }}
        run: |
          echo "The tests ended: $RESULT, and the credit check: $CREDIT"
          test "$RESULT" = success && test "$CREDIT" = success
