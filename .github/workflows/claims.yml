name: Claims

# One lead per game and one person per task (docs/TEAMS.md). A New Dreamport issue claims a whole game for the
# person who opens it, unless the game already has a Dreamport or an earlier open New Dreamport issue, and becomes the
# game's issue, which lists every piece of the game. A game's issue is the New Dreamport issue its entry names, or for
# a game with no entry yet, the open one that claims it. A Task issue goes under its game's issue as a sub-issue, and
# claims its task for its author when they tick the box. On any open issue of a game, a comment starting with /claim
# takes it while nobody has it, and /release gives it back. Each answer is a comment, and the daily run releases every
# claim whose holder has done nothing on the game's issues or pull requests for 14 days, or 7 for a foundation, which
# other pieces wait on. It lists a game's free pieces as src/lib/pieces.mjs has them. Each run only
# reads the issues' text and the repository's files, through the API, and runs nothing from them. Runs on one issue
# wait for each other, and each answers every command on its issue that has no answer yet, since GitHub cancels all
# but the newest waiting run of a concurrency group. A run that gives, takes back or adds a piece builds dreamports.net
# again, so each game's page in its Make row shows how many pieces are free (docs/MAKE.md).
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Days without activity before a claim is released (a fraction of a day tries it out)
        default: '14'

permissions:
  contents: read
  issues: write

concurrency:
  group: claims-${{ github.event.issue.number || 'release' }}
  cancel-in-progress: false

jobs:
  claims:
    name: Answer claims, and release quiet ones
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && contains(github.event.issue.body, '### Game folder'))
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
        && (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/release')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # the Deploy Hook that builds dreamports.net, kept in the repository's secrets
      DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - name: Answer claims, or release the quiet ones
        id: claims
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '14' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';

          const repository = process.env.GITHUB_REPOSITORY;
          const [owner, name] = repository.split('/');
          const root = `https://api.github.com/repos/${repository}`;
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          // a REST call: its answer, true for an empty one, and null for a GET of something that isn't there
          async function api(path, method = 'GET', body) {
            const response = await fetch(root + path, {
              method, headers, signal: AbortSignal.timeout(30000),
              ...(body === undefined ? {} : { body: JSON.stringify(body) })
            });
            if (method === 'GET' && response.status === 404) return null;
            if (!response.ok) {
              const error = new Error(`GitHub API ${method} ${path}: HTTP ${response.status} ${await response.text()}`);
              error.status = response.status;
              throw error;
            }
            return response.status === 204 ? true : response.json();
          }
          async function list(path) {
            const result = [];
            for (let page = 1; ; page++) {
              const batch = await api(`${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`) ?? [];
              result.push(...batch);
              if (batch.length < 100) return result;
            }
          }

          const BOT = 'github-actions[bot]';
          // each answer ends with what it answers (a comment's id, the issue itself, or a quiet claim) and what it did
          const MARK = /<!-- dreamports-claims: answers=(\S+)(?: (granted|released)=(\S+))? -->/;
          const NAME = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
          const DAY = 86400000;
          const days = Number(process.env.DAYS);
          if (!(days > 0)) throw new Error(`A claim is released after a number of days above 0, not "${process.env.DAYS}".`);
          // a foundation is what other pieces wait on, so a quiet claim on one is released in half the time
          const isFoundation = issue => field(issue.body, 'Kind') === 'Foundation';
          const daysOf = issue => (isFoundation(issue) ? days / 2 : days);
          const periodOf = issue => (daysOf(issue) === 1 ? '1 day' : `${daysOf(issue)} days`);
          const form = template => `https://github.com/${repository}/issues/new?template=${template}`;
          const guide = `https://github.com/${repository}/blob/main/docs/TEAMS.md`;
          const same = (a, b) => a.toLowerCase() === b.toLowerCase();
          const done = [];
          // whether a piece was given, taken back or added, which the game's page in the Make row shows
          let changed = false;

          // a field of an issue form: the text under its "### <label>" heading, or null when it's empty
          function field(body, label) {
            const found = new RegExp(`^###\\s*${label}[ \\t]*\\r?\\n([\\s\\S]*?)(?=^###\\s|(?![\\s\\S]))`, 'm').exec(body ?? '');
            const text = found?.[1].trim();
            return text && text !== '_No response_' ? text : null;
          }
          const folderIn = issue => field(issue.body, 'Game folder')?.replace(/`/g, '').trim() ?? null;
          const isNewDreamport = issue => folderIn(issue) !== null && field(issue.body, 'Where it starts') !== null;
          const isTask = issue => folderIn(issue) !== null && field(issue.body, 'Done when') !== null;
          const ticked = issue => /^- \[x\] I'm taking this task myself\.?\s*$/im.test(issue.body ?? '');
          const commandIn = body => /^\s*\/(claim|release)\b/i.exec(body ?? '')?.[1].toLowerCase() ?? null;
          const day = when => new Date(when).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });

          // the games: the folders in games/, and the games claimed with an open New Dreamport issue
          let folders, leads;
          async function gameFolders() {
            folders ??= new Set(((await api('/contents/games')) ?? []).filter(f => f.type === 'dir').map(f => f.name));
            return folders;
          }
          async function leadIssues() {
            leads ??= (await list('/issues?state=open&sort=created&direction=asc')).filter(i => !i.pull_request && isNewDreamport(i));
            return leads;
          }
          // the issue that claims the game for its lead: the first open New Dreamport issue for it
          const leadIssueOf = async game => (await leadIssues()).find(i => folderIn(i) === game) ?? null;
          async function entryOf(game) {
            const file = await api(`/contents/games/${game}/entry.md`);
            if (!file?.content) return null;
            const text = Buffer.from(file.content, 'base64').toString('utf8');
            const value = key => new RegExp(`^${key}:\\s*(.+)$`, 'm').exec(text)?.[1].trim().replace(/^(['"])(.*)\1$/, '$2') ?? null;
            return { title: value('title'), lead: value('lead'), issue: Number(value('issue')) || null };
          }
          // the game's issue, which lists its pieces: the New Dreamport issue its entry names, or else the open one that
          // claims it, which is also what a copy of the repository finds, where the entry's number is another issue
          const homes = new Map();
          function gameIssueOf(game) {
            if (!homes.has(game)) homes.set(game, (async () => {
              const named = (await entryOf(game))?.issue;
              const issue = named && await api(`/issues/${named}`);
              if (issue && !issue.pull_request && isNewDreamport(issue) && folderIn(issue) === game) return issue;
              return leadIssueOf(game);
            })());
            return homes.get(game);
          }
          // a game's pieces: the issues of this repository under its game's issue, open and closed
          const piecesOf = async home => (await list(`/issues/${home.number}/sub_issues`)).filter(i => i.repository_url?.toLowerCase() === root.toLowerCase());
          // the game an issue is for: its form's folder, a game's label, or the game's issue it's under
          async function gameOf(issue) {
            const named = folderIn(issue);
            if (named !== null) return NAME.test(named) ? named : null;
            const games = await gameFolders(), claimed = (await leadIssues()).map(folderIn);
            const labelled = issue.labels.map(l => l.name).find(l => games.has(l) || claimed.includes(l));
            if (labelled) return labelled;
            const parent = issue.parent_issue_url?.toLowerCase().startsWith(`${root}/issues/`.toLowerCase()) && await api(issue.parent_issue_url.slice(root.length));
            const game = parent && isNewDreamport(parent) ? folderIn(parent) : null;
            return game && NAME.test(game) ? game : null;
          }
          async function titleOf(game) {
            const entry = await entryOf(game);
            if (entry?.title) return entry.title;
            const named = field((await leadIssueOf(game))?.body, 'Game');
            return named ? `${named.replace(/\s+Dreamport$/i, '')} Dreamport` : game;
          }

          async function ensureLabel(label, color, description) {
            if (await api(`/labels/${encodeURIComponent(label)}`)) return;
            try {
              await api('/labels', 'POST', { name: label, color, description });
            } catch (error) {
              // made at the same moment by another run
              if (error.status !== 422) throw error;
            }
          }
          // a game's milestone: the one its issues already use, or one named after its Dreamport
          async function milestoneOf(game, title) {
            const used = (await list(`/issues?state=all&labels=${encodeURIComponent(game)}&sort=created&direction=asc`)).find(i => i.milestone);
            if (used) return used.milestone;
            const named = async () => (await list('/milestones?state=all')).find(m => m.title === title);
            const found = await named();
            if (found) return found;
            try {
              return await api('/milestones', 'POST', { title, description: `${title}, made in games/${game}/: its New Dreamport issue and its tasks.` });
            } catch (error) {
              // made at the same moment by another run, such as the New Dreamport issue's when a task follows within seconds
              const made = error.status === 422 && await named();
              if (!made) throw error;
              return made;
            }
          }
          // a game's issue carries its label, its kind and its milestone
          async function prepare(issue, game, title) {
            await ensureLabel(game, '4f86ff', `${title}, in games/${game}/`);
            const kind = isNewDreamport(issue) ? 'new-dreamport' : isTask(issue) ? 'task' : null;
            const missing = [game, kind].filter(l => l && !issue.labels.some(x => x.name === l));
            if (missing.length) issue.labels = await api(`/issues/${issue.number}/labels`, 'POST', { labels: missing });
            if (!issue.milestone) {
              const milestone = await milestoneOf(game, title);
              await api(`/issues/${issue.number}`, 'PATCH', { milestone: milestone.number });
              issue.milestone = milestone;
            }
          }

          async function answer(issue, about, text, what) {
            await api(`/issues/${issue.number}/comments`, 'POST', { body: `${text}\n\n<!-- dreamports-claims: answers=${about}${what ? ` ${what}` : ''} -->` });
            done.push(`#${issue.number}: ${what ?? 'answered'}`);
          }
          async function close(issue, reason) {
            await api(`/issues/${issue.number}`, 'PATCH', { state: 'closed', state_reason: reason });
          }

          // what a game's parts.json lists, foundations first, each with what it needs: read once for each game
          const plans = new Map();
          function planOf(game) {
            if (!plans.has(game)) plans.set(game, (async () => {
              const file = await api(`/contents/games/${game}/proof/parts.json`);
              try {
                const { foundations, parts } = JSON.parse(Buffer.from(file?.content ?? '', 'base64').toString('utf8'));
                return [...(foundations ?? []).map(f => ({ ...f, foundation: true })), ...(parts ?? [])];
              } catch {
                return [];
              }
            })());
            return plans.get(game);
          }
          // the language of a game's main version (src/lib/languages.mjs): JavaScript when the game's folder has its page, or
          // C in a game that started in C, with only games/<game>/c/index.html, whose pieces wait on nothing in JavaScript
          const mains = new Map();
          function mainOf(game) {
            if (!mains.has(game)) mains.set(game, (async () => (
              await api(`/contents/games/${game}/index.html`) || !await api(`/contents/games/${game}/c/index.html`) ? 'js' : 'c'
            ))());
            return mains.get(game);
          }
          const nameOf = title => title.replace(/^Task:\s*/i, '').trim();
          const sameName = (a, b) => same(String(a ?? '').trim(), String(b ?? '').trim());
          // a piece's part and language: "Task: Title screen in C" is a part of the game's version in C (src/lib/languages.mjs)
          const LANGUAGES = { c: 'C' };
          function partOf(title) {
            const name = nameOf(title);
            for (const [language, called] of Object.entries(LANGUAGES)) {
              const suffix = ` in ${called}`;
              if (name.length > suffix.length && same(name.slice(-suffix.length), suffix)) return { name: name.slice(0, -suffix.length).trim(), language };
            }
            return { name, language: 'js' };
          }
          // what a piece is still waiting on, each as a name, with its number when it has an issue: what parts.json says
          // it needs, unless that issue is closed, or for a part with no issue in the main language, unless parts.json names
          // its recording. A piece in another language needs what it needs in that language, and the same piece in the
          // main language first
          function waitingOn(piece, pieces, plan, main = 'js') {
            const { name, language } = partOf(piece.title);
            const needs = plan.find(p => sameName(p.name, name))?.needs;
            const all = [...(language === main ? [] : [[name, main]]), ...(Array.isArray(needs) ? needs : []).map(need => [need, language])];
            return all.flatMap(([need, lang]) => {
              const found = pieces.find(p => sameName(partOf(p.title).name, need) && partOf(p.title).language === lang);
              if (found) return found.state === 'open' ? [`#${found.number} ${nameOf(found.title)}`] : [];
              if (lang !== main) return [lang === 'js' ? need : `${need} in ${LANGUAGES[lang]}`];
              return plan.find(p => sameName(p.name, need))?.recording ? [] : [need];
            });
          }

          // what's still free in a game: its lead, when nobody leads it, and the pieces under its game's issue nobody has
          // and that wait on nothing, foundations first
          async function free(game, title, except) {
            const home = await gameIssueOf(game);
            const pieces = home ? await piecesOf(home) : [], plan = await planOf(game), main = await mainOf(game);
            const foundation = piece => plan.find(p => sameName(p.name, partOf(piece.title).name))?.foundation === true;
            const startable = pieces.filter(i => i.state === 'open' && !i.assignees.length && i.number !== except && !waitingOn(i, pieces, plan, main).length);
            const tasks = [...startable.filter(foundation), ...startable.filter(i => !foundation(i))];
            const lines = [];
            if (home?.state === 'open' && !home.assignees.length && home.number !== except) lines.push(`- #${home.number}: leading ${title}`);
            lines.push(...tasks.slice(0, 10).map(t => `- #${t.number}: ${t.title.replace(/^Task:\s*/i, '')}`));
            if (tasks.length > 10) lines.push(`- and ${tasks.length - 10} more, listed in #${home.number}`);
            return lines.length
              ? `What's still free in ${title}, each yours with \`/claim\` on it:\n\n${lines.join('\n')}`
              : `Nothing else in ${title} is free right now. [The Task form](${form('task.yml')}) suggests a new task.`;
          }

          async function claim(issue, user, about, game, title) {
            const lead = isNewDreamport(issue);
            const holders = issue.assignees.map(a => a.login);
            if (holders.some(h => same(h, user))) {
              return answer(issue, about, `@${user}, ${lead ? `you already lead ${title}` : 'this task is already yours'}.`);
            }
            if (holders.length) {
              const granted = (await list(`/issues/${issue.number}/comments`))
                .filter(c => c.user.login === BOT && MARK.exec(c.body)?.[2] === 'granted' && same(MARK.exec(c.body)[3], holders[0])).pop();
              const since = granted ? ` since ${day(granted.created_at)}` : '';
              return answer(issue, about, `@${user}, ${lead ? `@${holders[0]} has led ${title}${since}` : `@${holders[0]} has had this task${since}`}, so it isn't free.\n\n${await free(game, title, issue.number)}`);
            }
            // GitHub leaves out anyone it can't assign, so the answer says whether it worked
            const after = await api(`/issues/${issue.number}/assignees`, 'POST', { assignees: [user] });
            issue.assignees = after.assignees;
            if (!issue.assignees.some(a => same(a.login, user))) {
              return answer(issue, about, `@${user}, GitHub didn't let me assign this to you, so it's still free. Say so here, and the Dreamports team will look into it.`);
            }
            changed = true;
            const help = `A claim with no activity on ${title}'s issues or pull requests for ${periodOf(issue)} is released, and \`/release\` gives it back sooner. [Claims and teams](${guide}) says what comes next.`;
            const home = lead ? null : await gameIssueOf(game);
            const waits = home ? waitingOn(issue, await piecesOf(home), await planOf(game), await mainOf(game)) : [];
            const waiting = waits.length ? ` It needs ${waits.join(' and ')} first, which ${waits.length === 1 ? 'isn\'t' : 'aren\'t'} finished, so it can't be finished before then.` : '';
            return answer(issue, about, lead
              ? `@${user}, ${title} is yours to lead. This is its game's issue, where it's talked about: the tasks you open for it with [the Task form](${form('task.yml')}) land under it, with the label \`${game}\`, and anyone can claim them. ${help}`
              : `@${user}, this task is yours, and nobody else can claim it while you have it.${waiting} ${help}`,
            `granted=${user}`);
          }

          async function release(issue, user, about, title) {
            const lead = isNewDreamport(issue);
            if (!issue.assignees.some(a => same(a.login, user))) {
              return answer(issue, about, `@${user}, ${lead ? `you don't lead ${title}` : 'this task isn\'t yours'}, so there's nothing to give back.`);
            }
            const after = await api(`/issues/${issue.number}/assignees`, 'DELETE', { assignees: [user] });
            issue.assignees = after.assignees;
            changed = true;
            return answer(issue, about, lead
              ? `@${user} no longer leads ${title}, so leading it is free: \`/claim\` here takes it.`
              : `@${user} gave this task back, so it's free: \`/claim\` takes it.`,
            `released=${user}`);
          }

          // a New Dreamport issue claims its game, unless something else already does
          async function openGame(issue) {
            const user = issue.user.login, game = folderIn(issue);
            const named = field(issue.body, 'Game')?.replace(/\s+Dreamport$/i, '') ?? game;
            if (!NAME.test(game)) {
              await answer(issue, 'issue', `@${user}, \`${game}\` can't be a game's folder: it's lowercase letters, numbers and single dashes, such as \`sonic-battle\`. [The New Dreamport form](${form('new-dreamport.yml')}) starts it again.`);
              return close(issue, 'not_planned');
            }
            const label = await api(`/labels/${encodeURIComponent(game)}`);
            if (label && !label.description?.endsWith(`in games/${game}/`)) {
              await answer(issue, 'issue', `@${user}, \`${game}\` is already one of the repository's labels, for something else, so a game can't have it as its folder. [The New Dreamport form](${form('new-dreamport.yml')}) starts it again with another.`);
              return close(issue, 'not_planned');
            }
            const entry = await entryOf(game);
            // a game made before the forms gets its game's issue this way, once its entry names it
            if (entry?.issue === issue.number) {
              const title = entry.title ?? `${named} Dreamport`;
              await prepare(issue, game, title);
              return claim(issue, user, 'issue', game, title);
            }
            if (entry || (await gameFolders()).has(game)) {
              const title = entry?.title ?? game;
              const home = await gameIssueOf(game);
              const lead = home ? home.assignees[0]?.login : entry?.lead;
              await answer(issue, 'issue', `@${user}, ${title} already exists, in games/${game}/${lead ? `, led by @${lead}` : ''}.${home ? ` Its game's issue is #${home.number}, which lists its pieces.` : ''}\n\n${await free(game, title, issue.number)}`);
              return close(issue, 'duplicate');
            }
            const earlier = (await leadIssues()).find(i => folderIn(i) === game && i.number < issue.number);
            if (earlier) {
              const title = await titleOf(game);
              const who = earlier.assignees[0]?.login;
              await answer(issue, 'issue', `@${user}, ${title} was claimed first, in #${earlier.number}${who ? `, and @${who} leads it` : ''}.\n\n${await free(game, title, issue.number)}`);
              return close(issue, 'duplicate');
            }
            const title = `${named} Dreamport`;
            await prepare(issue, game, title);
            await claim(issue, user, 'issue', game, title);
          }

          // a task goes under its game's issue, unless it's under an issue already
          async function attach(issue, game) {
            if (issue.parent_issue_url) return;
            const home = await gameIssueOf(game);
            if (!home || home.number === issue.number) return;
            try {
              await api(`/issues/${home.number}/sub_issues`, 'POST', { sub_issue_id: issue.id });
              issue.parent_issue_url = home.url;
              changed = true;
              done.push(`#${issue.number}: under #${home.number}`);
            } catch (error) {
              // under one already, put there at the same moment, or past GitHub's 100 sub-issues: it can still be claimed
              if (error.status !== 422) throw error;
              done.push(`#${issue.number}: not put under #${home.number}, ${error.message}`);
            }
          }
          // a task nobody took at first is done once it has its game's label, its kind and its milestone, and is under
          // its game's issue, if the game has one
          async function prepared(issue) {
            const game = folderIn(issue);
            if (![game, 'task'].every(l => issue.labels.some(x => x.name === l)) || !issue.milestone) return false;
            return Boolean(issue.parent_issue_url) || !(await gameIssueOf(game));
          }

          // a Task issue gets its game's label and milestone, goes under its game's issue, and gets its author when they
          // take it
          async function openTask(issue) {
            const user = issue.user.login, game = folderIn(issue);
            const known = NAME.test(game) && ((await gameFolders()).has(game) || await leadIssueOf(game));
            if (!known) {
              await answer(issue, 'issue', `@${user}, nobody is making a Dreamport of \`${game}\` yet, so it has no tasks. [The New Dreamport form](${form('new-dreamport.yml')}) starts one, and \`npm run dp -- find\` lists the games being made.`);
              return close(issue, 'not_planned');
            }
            const title = await titleOf(game);
            await prepare(issue, game, title);
            await attach(issue, game);
            if (ticked(issue)) await claim(issue, user, 'issue', game, title);
          }

          // everything on one issue that has no answer yet: the issue itself, then each /claim and /release, in order
          async function handle(number) {
            const issue = await api(`/issues/${number}`);
            if (!issue || issue.pull_request) return;
            const comments = await list(`/issues/${number}/comments`);
            const answered = new Set(comments.filter(c => c.user.login === BOT).map(c => MARK.exec(c.body)?.[1]).filter(Boolean));
            if (issue.state === 'open' && !answered.has('issue')) {
              if (isNewDreamport(issue)) await openGame(issue);
              else if (isTask(issue) && (ticked(issue) || !(await prepared(issue)))) await openTask(issue);
            }
            for (const comment of comments) {
              const verb = comment.user.type === 'Bot' || answered.has(String(comment.id)) ? null : commandIn(comment.body);
              if (!verb) continue;
              const user = comment.user.login, about = String(comment.id);
              if (issue.state !== 'open') {
                await answer(issue, about, `@${user}, this issue is closed, so there's nothing to ${verb}.`);
                continue;
              }
              const game = await gameOf(issue);
              if (!game) {
                await answer(issue, about, `@${user}, this issue isn't one of a Dreamport's tasks, so it can't be claimed. A game's tasks are under its game's issue, and [the Task form](${form('task.yml')}) opens a new one.`);
                continue;
              }
              const title = await titleOf(game);
              if (verb === 'claim') {
                // a piece someone moved under the game's issue by hand gets the game's label and milestone too, since the
                // daily run finds a holder's activity by the label
                await prepare(issue, game, title);
                await claim(issue, user, about, game, title);
              } else await release(issue, user, about, title);
            }
          }

          // who did anything on a game since a moment: on its issues and pull requests
          const active = new Map();
          async function activeOn(game, since) {
            const asked = `${game} ${since}`;
            if (active.has(asked)) return active.get(asked);
            const people = new Set();
            const seen = (who, when) => { if (who && when && Date.parse(when) >= since) people.add(who.toLowerCase()); };
            for (const item of await list(`/issues?state=all&labels=${encodeURIComponent(game)}&since=${new Date(since).toISOString()}`)) {
              seen(item.user.login, item.created_at);
              for (const e of await list(`/issues/${item.number}/timeline`)) seen(e.actor?.login ?? e.user?.login, e.created_at ?? e.submitted_at);
            }
            active.set(asked, people);
            return people;
          }

          // the daily run: answers what a run missed, then releases the claims nobody has worked on
          async function releaseQuiet() {
            const now = Date.now();
            const open = (await list('/issues?state=open&sort=created&direction=asc')).filter(i => !i.pull_request);
            // an issue changed in the last minutes has its own run
            for (const issue of open) if (Date.parse(issue.updated_at) < Date.now() - 600000) await handle(issue.number);
            for (const listed of open) {
              const issue = await api(`/issues/${listed.number}`);
              if (issue.state !== 'open' || !issue.assignees.length) continue;
              const game = await gameOf(issue);
              if (!game) continue;
              // only the claims the bot granted: an issue assigned by hand stays as people left it
              const held = new Map();
              for (const c of await list(`/issues/${issue.number}/comments`)) {
                const found = c.user.login === BOT && MARK.exec(c.body);
                if (!found?.[2]) continue;
                if (found[2] === 'granted') held.set(found[3].toLowerCase(), c.created_at);
                else held.delete(found[3].toLowerCase());
              }
              for (const { login } of issue.assignees) {
                if (!held.has(login.toLowerCase()) || (await activeOn(game, now - daysOf(issue) * DAY)).has(login.toLowerCase())) continue;
                const title = await titleOf(game);
                await api(`/issues/${issue.number}/assignees`, 'DELETE', { assignees: [login] });
                changed = true;
                await answer(issue, 'quiet', isNewDreamport(issue)
                  ? `@${login}, there's been no news from you on ${title} for ${periodOf(issue)}, so leading it is free again. Nothing is lost: your work and your team build stay where they are, for the next lead to start from, and \`/claim\` here takes it back, you included, while it's still free.`
                  : `@${login}, there's been no news on this task for ${periodOf(issue)}, so it's free again for anyone to take. Nothing is lost: your work and your preview stay where they are, and \`/claim\` takes it back, you included, while it's still free.`,
                `released=${login}`);
              }
            }
          }

          await ensureLabel('new-dreamport', 'fbca04', 'Claims a whole game for its lead, from the New Dreamport form');
          await ensureLabel('task', 'c5def5', 'One piece of a Dreamport, which one person claims at a time');
          if (event.issue) await handle(event.issue.number);
          else await releaseQuiet();
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `# Claims\n\n${done.length ? done.map(d => `- ${d}`).join('\n') : 'Nothing to answer or release.'}\n\nOnly issues were read and written. Nothing from them was run.\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          NODE

      - name: Build dreamports.net again, for its Make pages
        if: steps.claims.outputs.changed == 'true' && env.DEPLOY_HOOK != ''
        run: |
          if curl --fail --silent --show-error --max-time 30 --output /dev/null --request POST "$DEPLOY_HOOK"; then
            echo 'Cloudflare is building dreamports.net again.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Cloudflare didn't start a build, so the Make pages wait for the next one."
          fi
