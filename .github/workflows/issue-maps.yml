name: Issue maps

# Each game's issue shows its progress map at the top (docs/TEAMS.md#how-the-bot-works). The proof tools draw the map and
# npm run check holds it to the game's proof/ folder, so this only puts that picture in the issue, and no model is asked
# anything. A run follows each push that changes a map, and one each hour catches a merge made by another workflow, as a
# first entry's is, which starts no run here. It runs only this repository's code, reads an issue's text as data, and
# edits an issue only when its picture changed.
on:
  push:
    branches: [main]
    paths: ['.github/readme/progress/**']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-maps
  cancel-in-progress: false

jobs:
  update:
    name: Put each map in its game's issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bring each game's issue up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/issue-maps/update.mjs
