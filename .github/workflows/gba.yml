  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fails a pull request that one above it in a stack carries, so none of the jobs after it starts (.github/stack/stack.mjs)
  stack:
    name: Stack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/stack
      - name: Stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/stack/stack.mjs

  linux:
    name: Linux on ${{ matrix.chip }} (Game Boy Advance)
    needs: stack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: Intel, runner: ubuntu-24.04, arch: x64 }
          - { chip: ARM, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      # the tests themselves run on Linux in Check
      - run: npm run test:gba-same -- --write gba-same-linux-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gba-same-linux-${{ matrix.arch }}
          path: gba-same-linux-${{ matrix.arch }}.json
          retention-days: 7

  mac:
    name: Mac (Game Boy Advance)
    needs: stack
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # what a person's Mac has or installs: Apple's command line tools give git and the C compiler, Homebrew gives
      # Node.js, the GitHub CLI and CMake, and Chrome is there
      - name: Getting ready on a Mac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          xcode-select -p
          cc --version | head -1
          git --version
          brew --version | head -1
          brew install --quiet node gh cmake
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cmake --version | head -1
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - name: The tools' packages
        run: |
          test "$(command -v node)" = "$(brew --prefix)/bin/node"
          node --version
          npm ci
      - run: npm run dp -- setup

      # first, so the comparison has it even when a test after it fails
      - run: npm run test:gba-same -- --write gba-same-mac-arm64.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gba-same-mac-arm64
          path: gba-same-mac-arm64.json
          retention-days: 7

      - run: npm run test:match
      - run: npm run test:twin
      - run: npm run test:rebuild
      - run: npm run test:libraries
      - run: npm run test:function-tasks
      - run: npm run test:same-memory
      - run: npm run test:part-tasks -- gba

  windows:
    name: Windows (Game Boy Advance)
    needs: stack
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Windows has or installs: git and Node.js, and Edge, which comes with Windows. setup gets the
      # compiler and CMake itself (tools/gba/windows.mjs)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run dp -- setup

      - run: npm run test:gba-same -- --write gba-same-windows-x64.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gba-same-windows-x64
          path: gba-same-windows-x64.json
          retention-days: 7

      - run: npm run test:match
      - run: npm run test:twin
      - run: npm run test:rebuild
      - run: npm run test:libraries
      - run: npm run test:function-tasks
      - run: npm run test:same-memory
      - run: npm run test:part-tasks -- gba

  same:
    name: The same compiler on every computer (Game Boy Advance)
    needs: [stack, linux, mac, windows]
    # even when a later test on the Mac or Windows failed, as each computer's builds are written before them
    if: ${{ !cancelled() && needs.stack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gba-same-*
          merge-multiple: true
      - run: node tools/test/gba-same.mjs --compare gba-same-linux-x64.json gba-same-linux-arm64.json gba-same-mac-arm64.json gba-same-windows-x64.json
