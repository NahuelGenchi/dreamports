  pull_request:
    paths:
      - '.github/workflows/gba.yml'
      - '.node-version'
      - '.npmrc'
      - 'kit/c/console.c'
      - 'kit/c/disc.c'
      - 'kit/c/disc.h'
      - 'kit/c/game.js'
      - 'kit/c/kit.c'
      - 'kit/c/kit.h'
      - 'kit/c/libc.c'
      - 'kit/c/native.c'
      - 'kit/c/page.h'
      - 'kit/c/pause.c'
      - 'kit/c/worklet.js'
