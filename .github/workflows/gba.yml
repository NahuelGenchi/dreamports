name: Mac and Windows (Game Boy Advance)

# The Game Boy Advance's proof tools on a Mac and on Windows, as a person making a Dreamport on one has them (#1453), on
# GitHub's own computers: Getting ready as tools/README.md has it, on a Mac with Apple's chip and one with Intel's, with
# Homebrew's Node.js, GitHub CLI and CMake, and on Windows with only git and Node.js, where setup gets its own compiler
# and CMake. Each runs npm run test:match and test:twin, the function check, test:rebuild and test:libraries, which run
# match and twin from npm run dp on games of the project's own, and test:same-memory, which builds a program of the
# project's own as a cartridge and as a Dreamport from the same C and proves every frame and the whole work memory the
# same in mGBA and in the computer's own browser. The Macs also run test:function-tasks, whose stand-in for the GitHub
# CLI is a script Windows can't start by that name.
#
# And every computer builds agbcc, the console's compiler, from the same source with its own C compiler, Linux on an
# Intel and on an ARM chip among them, and writes what it made of every C file it builds (npm run test:gba-same). A
# last job finds every file the same on all of them: a proof made on one computer has to be one on every other.
# Nothing from any game's copy is needed, and nothing is sent anywhere.
#
# It isn't part of Check, as the Macs and Windows take longer to start and build. It runs on pull requests that touch
# what those tools are made of, after they merge, every week, so the newest Mac and Windows GitHub has try it too, and
# by hand.
on:
  pull_request:
    paths:
      - '.github/workflows/gba.yml'
      - 'kit/c/**'
      - 'kit/consoles.js'
      - 'kit/gba/**'
      - 'src/lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/**'
      - '!tools/**/*.md'
      - '!tools/commands/**'
      - '!tools/libretro/**'
      - '!tools/nes/**'
      - '!tools/ps1/**'
      - '!tools/ps2/**'
      - '!tools/test/made-up-ps*'
      - '!tools/test/nes-*'
      - '!tools/test/nes-twin/**'
      - '!tools/test/ps1-*'
      - '!tools/test/ps1-*/**'
      - '!tools/test/ps2-*'
      - '!tools/test/ps2-*/**'
      - '!tools/test/real-ps2.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gba.yml'
      - 'kit/c/**'
      - 'kit/consoles.js'
      - 'kit/gba/**'
      - 'src/lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/**'
      - '!tools/**/*.md'
      - '!tools/commands/**'
      - '!tools/libretro/**'
      - '!tools/nes/**'
      - '!tools/ps1/**'
      - '!tools/ps2/**'
      - '!tools/test/made-up-ps*'
      - '!tools/test/nes-*'
      - '!tools/test/nes-twin/**'
      - '!tools/test/ps1-*'
      - '!tools/test/ps1-*/**'
      - '!tools/test/ps2-*'
      - '!tools/test/ps2-*/**'
      - '!tools/test/real-ps2.mjs'
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux on ${{ matrix.chip }} (Game Boy Advance)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: Intel, runner: ubuntu-24.04, arch: x64 }
          - { chip: ARM, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      # the tests themselves run on Linux in Check
      - run: npm run test:gba-same -- --write gba-same-linux-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gba-same-linux-${{ matrix.arch }}
          path: gba-same-linux-${{ matrix.arch }}.json
          retention-days: 7

  mac:
    name: Mac with ${{ matrix.chip }}'s chip (Game Boy Advance)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: Apple, runner: macos-latest, machine: arm64, arch: arm64 }
          - { chip: Intel, runner: macos-15-intel, machine: x86_64, arch: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # what a person's Mac has or installs: Apple's command line tools give git and the C compiler, Homebrew gives
      # Node.js, the GitHub CLI and CMake, and Chrome is there
      - name: Getting ready on a Mac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          MACHINE: ${{ matrix.machine }}
        run: |
          sw_vers
          test "$(uname -m)" = "$MACHINE"
          xcode-select -p
          cc --version | head -1
          git --version
          brew --version | head -1
          brew install --quiet node gh cmake
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cmake --version | head -1
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - name: The tools' packages
        run: |
          test "$(command -v node)" = "$(brew --prefix)/bin/node"
          node --version
          npm ci
      - run: npm run dp -- setup

      # first, so the comparison has it even when a test after it fails
      - run: npm run test:gba-same -- --write gba-same-mac-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gba-same-mac-${{ matrix.arch }}
          path: gba-same-mac-${{ matrix.arch }}.json
          retention-days: 7

      - run: npm run test:match
      - run: npm run test:twin
      - run: npm run test:rebuild
      - run: npm run test:libraries
      - run: npm run test:function-tasks
      - run: npm run test:same-memory

  windows:
    name: Windows (Game Boy Advance)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Windows has or installs: git and Node.js, and Edge, which comes with Windows. setup gets the
      # compiler and CMake itself (tools/gba/windows.mjs)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run dp -- setup

      - run: npm run test:gba-same -- --write gba-same-windows-x64.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gba-same-windows-x64
          path: gba-same-windows-x64.json
          retention-days: 7

      - run: npm run test:match
      - run: npm run test:twin
      - run: npm run test:rebuild
      - run: npm run test:libraries
      - run: npm run test:same-memory

  same:
    name: The same compiler on every computer (Game Boy Advance)
    needs: [linux, mac, windows]
    # even when a later test on a Mac or Windows failed, as each computer's builds are written before them
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gba-same-*
          merge-multiple: true
      - run: node tools/test/gba-same.mjs --compare gba-same-linux-x64.json gba-same-linux-arm64.json gba-same-mac-arm64.json gba-same-mac-x64.json gba-same-windows-x64.json
