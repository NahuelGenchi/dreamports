name: Mac and Windows (Game Boy Advance)

# The Game Boy Advance's proof tools on a Mac and on Windows, as a person making a Dreamport on one has them (#1453), on
# GitHub's own computers: Getting ready as tools/README.md has it, on a Mac with Apple's chip, with Homebrew's Node.js,
# GitHub CLI and CMake, and on Windows with only git and Node.js, where setup gets its own compiler and CMake. Each runs npm run test:match and test:twin, the function check, test:rebuild and test:libraries, which run
# match and twin from npm run dp on games of the project's own, and test:same-memory, which builds a program of the
# project's own as a cartridge and as a Dreamport from the same C and proves every frame and the whole work memory the
# same in mGBA and in the computer's own browser, and test:function-tasks, a game made a function at a time against a
# stand-in for GitHub, which the tools start with Node.js on every system (#1912), and test:part-tasks, a game whose
# parts are its tasks from its first day to its last task done, on the Game Boy Advance. A Mac with Intel's chip is left out, as Apple no longer makes one,
# and GitHub's Macs, five at a time, are shared with the PlayStation 2's workflow: Linux on Intel builds agbcc on the
# same kind of chip.
#
# And every computer builds agbcc, the console's compiler, from the same source with its own C compiler, Linux on an
# Intel and on an ARM chip among them, and writes what it made of every C file it builds (npm run test:gba-same). A
# last job finds every file the same on all of them: a proof made on one computer has to be one on every other.
# Nothing from any game's copy is needed, and nothing is sent anywhere.
#
# It isn't part of Check, as a Mac and Windows take longer to start and build. It runs on pull requests that touch
# what those tools are made of, after they merge, every week, so the newest Mac and Windows GitHub has try it too, and
# by hand.
