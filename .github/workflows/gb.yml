name: Linux, Mac and Windows (Game Boy)

# The Game Boy's and the Game Boy Color's tools on a Mac and on Windows, as a person making a Dreamport on one has
# them (#1911), on GitHub's own computers: a Mac with Apple's chip, with Homebrew's Node.js and CMake, and Windows with
# only git and Node.js, where the tools get their own compiler. Each builds Gambatte, the consoles' emulator, from its
# makers' source, and runs npm run test:real-gb: a program of the project's own and its Dreamport in C on the kit
# (kit/gbc/c/), which prove has to find the same in every frame, picture and sound, in the computer's own browser, and
# which the test then compares itself, every pixel and every sample of the sound. And npm run test:gb-twin, the
# function check: Gambatte's own processor, built by itself, runs a second program's functions, each checked against
# its twin in C. And on all three, with Linux, npm run test:part-tasks -- gb gbc: a made-up game of each console taken
# from its first day to its last task done, its parts its tasks (#1959), against a stand-in for GitHub. Nothing from any game's copy is
# needed, and nothing is sent anywhere.
#
# It isn't part of Check, where the first two tests run on Linux, as a Mac and Windows take longer to start and build,
# and test:part-tasks builds the site each time it runs ready. It runs on pull requests that touch what those tools are
# made of, after they merge, every week, so the newest Mac and Windows GitHub has try it too, and by hand.
on:
  pull_request:
    paths:
      - '.github/workflows/gb.yml'
      - 'kit/c/**'
      - 'kit/gbc/**'
      - 'kit/consoles.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/consoles.mjs'
      - 'tools/gbc/**'
      - 'tools/lib/c.mjs'
      - 'tools/libretro/**'
      - 'tools/test/gb-*'
      - 'tools/test/gb-*/**'
      - 'tools/test/made-up-gb*'
      - 'tools/test/real-gb.mjs'
      - 'tools/test/part-tasks.mjs'
      - 'tools/test/part-tasks/gb*'
      - 'tools/test/part-tasks/gb/**'
      - 'tools/lib/part-functions.mjs'
      - 'tools/lib/played.mjs'
      - 'tools/lib/proofs.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gb.yml'
      - 'kit/c/**'
      - 'kit/gbc/**'
      - 'kit/consoles.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/consoles.mjs'
      - 'tools/gbc/**'
      - 'tools/lib/c.mjs'
      - 'tools/libretro/**'
      - 'tools/test/gb-*'
      - 'tools/test/gb-*/**'
      - 'tools/test/made-up-gb*'
      - 'tools/test/real-gb.mjs'
      - 'tools/test/part-tasks.mjs'
      - 'tools/test/part-tasks/gb*'
      - 'tools/test/part-tasks/gb/**'
      - 'tools/lib/part-functions.mjs'
      - 'tools/lib/played.mjs'
      - 'tools/lib/proofs.mjs'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fails a pull request that one above it in a stack carries, so none of the jobs after it starts (.github/stack/stack.mjs)
  stack:
    name: Stack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/stack
      - name: Stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/stack/stack.mjs

  linux:
    name: Linux (Game Boy)
    needs: stack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      # the first two tests run in Check
      - run: npm run test:part-tasks -- gb gbc

  mac:
    name: Mac (Game Boy)
    needs: stack
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # what a person's Mac has or installs: Apple's command line tools give git, make and the C compiler, Homebrew
      # gives Node.js and CMake, and Chrome is there
      - name: Getting ready on a Mac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          cc --version | head -1
          brew install --quiet node cmake
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - name: The tools' packages
        run: |
          node --version
          npm ci
      - run: npm run test:real-gb
      - run: npm run test:gb-twin
      - run: npm run test:part-tasks -- gb gbc

  windows:
    name: Windows (Game Boy)
    needs: stack
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Windows has or installs: git and Node.js, and Edge, which comes with Windows. The tools get
      # the compiler themselves (tools/gba/windows.mjs)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run test:real-gb
      - run: npm run test:gb-twin
      - run: npm run test:part-tasks -- gb gbc
