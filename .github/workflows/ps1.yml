name: Mac and Windows (PlayStation)

# The PlayStation's tools on a Mac with Apple's chip and on Windows, as a person starting a PlayStation game on either
# will have them (#1938), on GitHub's own computers, each got ready as tools/README.md says: on a Mac, Apple's command
# line tools and Homebrew's Node.js; on Windows, only Node.js and git, where the tools get a compiler for each build by
# themselves (tools/gba/windows.mjs). Each builds PCSX ReARMed from its makers' source with the tools' change to it,
# and runs what Check runs on Linux: npm run test:ps1-gcc, GCC 2.x as WebAssembly; test:ps1-call and test:ps1-twin,
# the function check against the emulator's own interpreter; test:ps1-match; test:ps1-libraries; test:ps1-memories,
# the memories of play the function check starts from; and test:ps1-kit, the kit in C proven against the emulator, in
# the computer's own browser; and test:ps1-parts, a game whose parts are its tasks, from its first day to a part done
# (#1943). Nothing from any game is needed, and nothing is sent anywhere.
#
# It runs on pull requests that touch what the PlayStation's games need, after they merge, every week, and by hand.
on:
  pull_request:
    paths:
      - '.github/workflows/ps1.yml'
      - 'kit/c/**'
      - 'kit/consoles.js'
      - 'kit/ps1/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/consoles.mjs'
      - 'tools/gba/windows.mjs'
      - 'tools/lib/**'
      - 'tools/libretro/**'
      - 'tools/ps1/**'
      - 'tools/prove.mjs'
      - 'tools/twin.mjs'
      - 'tools/match.mjs'
      - 'tools/test/made-up-ps1*'
      - 'tools/test/ps1-*'
      - 'tools/test/ps1-*/**'
      - 'tools/test/parts-flow.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps1.yml'
      - 'kit/c/**'
      - 'kit/consoles.js'
      - 'kit/ps1/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/consoles.mjs'
      - 'tools/gba/windows.mjs'
      - 'tools/lib/**'
      - 'tools/libretro/**'
      - 'tools/ps1/**'
      - 'tools/prove.mjs'
      - 'tools/twin.mjs'
      - 'tools/match.mjs'
      - 'tools/test/made-up-ps1*'
      - 'tools/test/ps1-*'
      - 'tools/test/ps1-*/**'
      - 'tools/test/parts-flow.mjs'
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac (PlayStation)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Mac has or installs: Apple's command line tools give git and the C compiler, Homebrew gives
      # Node.js, and Chrome is there
      - name: Getting ready on a Mac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          xcode-select -p
          cc --version | head -1
          brew install --quiet node
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:ps1-gcc
      - run: npm run test:ps1-call
      - run: npm run test:ps1-twin
      - run: npm run test:ps1-match
      - run: npm run test:ps1-libraries
      - run: npm run test:ps1-memories
      - run: npm run test:ps1-kit
      - run: npm run test:ps1-parts

  windows:
    name: Windows (PlayStation)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Windows has or installs: git and Node.js, and Edge, which comes with Windows. Each build gets
      # the compiler itself (tools/gba/windows.mjs)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run test:ps1-gcc
      - run: npm run test:ps1-call
      - run: npm run test:ps1-twin
      - run: npm run test:ps1-match
      - run: npm run test:ps1-libraries
      - run: npm run test:ps1-memories
      - run: npm run test:ps1-kit
      - run: npm run test:ps1-parts
