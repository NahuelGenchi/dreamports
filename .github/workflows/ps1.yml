name: Mac and Windows (PlayStation)

# The PlayStation's tools on a Mac with Apple's chip and on Windows, as a person starting a PlayStation game on either
# will have them (#1938), on GitHub's own computers, each got ready as tools/README.md says: on a Mac, Apple's command
# line tools and Homebrew's Node.js; on Windows, only Node.js and git, where the tools get a compiler for each build by
# themselves (tools/gba/windows.mjs). Each builds PCSX ReARMed from its makers' source with the tools' change to it,
# and runs what Check runs on Linux: npm run test:ps1-gcc, GCC 2.x as WebAssembly; test:ps1-call and test:ps1-twin,
# the function check against the emulator's own interpreter; test:ps1-match; test:ps1-libraries; test:ps1-memories,
# the memories of play the function check starts from; and test:ps1-kit, the kit in C proven against the emulator, in
# the computer's own browser; and test:ps1-parts, a game whose parts are its tasks, from its first day to a part done
# (#1943). Nothing from any game is needed, and nothing is sent anywhere.
#
# It runs on pull requests that touch what the PlayStation's games need, after they merge, every week, and by hand.
on:
  pull_request:
    paths:
      - '.github/workflows/ps1.yml'
      - '.node-version'
      - '.npmrc'
      - 'kit/c/console.c'
      - 'kit/c/disc.c'
      - 'kit/c/disc.h'
      - 'kit/c/game.js'
      - 'kit/c/kit.c'
      - 'kit/c/kit.h'
      - 'kit/c/libc.c'
      - 'kit/c/native.c'
      - 'kit/c/page.h'
      - 'kit/c/pause.c'
      - 'kit/c/worklet.js'
      - 'kit/consoles.js'
      - 'kit/copy/cd.js'
      - 'kit/ps1/**'
      - 'package-lock.json'
      - 'package.json'
      - 'public/systems/ps1.svg'
      - 'tools/codemap.mjs'
      - 'tools/consoles.mjs'
      - 'tools/dp.mjs'
      - 'tools/find.mjs'
      - 'tools/gba/match.mjs'
      - 'tools/gba/new-game/**'
      - 'tools/gba/on-windows.h'
      - 'tools/gba/twin.mjs'
      - 'tools/gba/windows.mjs'
      - 'tools/lib/c.mjs'
      - 'tools/lib/chrome.mjs'
      - 'tools/lib/explore.h'
      - 'tools/lib/libraries.mjs'
      - 'tools/lib/new-game.mjs'
      - 'tools/lib/paths.mjs'
      - 'tools/lib/proof-files.mjs'
      - 'tools/lib/taking.mjs'
      - 'tools/libraries.mjs'
      - 'tools/libretro/build.mjs'
      - 'tools/libretro/calls.h'
      - 'tools/libretro/held.h'
      - 'tools/libretro/host.c'
      - 'tools/libretro/new-game/**'
      - 'tools/libretro/pcsx.patch'
      - 'tools/libretro/ran-ps2.h'
      - 'tools/libretro/ran.h'
      - 'tools/libretro/reference.mjs'
      - 'tools/libretro/starts.h'
      - 'tools/match.mjs'
      - 'tools/new.mjs'
      - 'tools/proofs.mjs'
      - 'tools/prove.mjs'
      - 'tools/ps1/**'
      - 'tools/ready.mjs'
      - 'tools/rom.mjs'
      - 'tools/setup.mjs'
      - 'tools/tasks.mjs'
      - 'tools/test/made-up-disc.mjs'
      - 'tools/test/made-up-ps1.mjs'
      - 'tools/test/parts-flow.mjs'
      - 'tools/test/ps1-call.mjs'
      - 'tools/test/ps1-gcc.mjs'
      - 'tools/test/ps1-kit.mjs'
      - 'tools/test/ps1-kit/**'
      - 'tools/test/ps1-libraries.mjs'
      - 'tools/test/ps1-match.mjs'
      - 'tools/test/ps1-match/**'
      - 'tools/test/ps1-memories.mjs'
      - 'tools/test/ps1-memories/**'
      - 'tools/test/ps1-parts.mjs'
      - 'tools/test/ps1-parts/**'
