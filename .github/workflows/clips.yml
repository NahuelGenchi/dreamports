name: Clips

# A pull request's clips keep the rules of docs/STANDARD.md#clips: tools/clips-check.mjs reads the text and every clip
# it links, with the measures share published beside it, and fails a clip share didn't make or one that breaks a rule,
# or a pull request that changes a game's code or recordings and links no clip of it (#1030). It runs again whenever
# the text changes. It fetches only the clips' own addresses, with a token that can only read.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # main requires this check (#1033), and the Readme workflow starts it on its own commit, as a pull request that
  # workflow's token opens starts no workflow by itself. Started that way it has no text, so it fails a branch that
  # changes the code or recordings of a game main has, which would need a clip.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clips:
    name: Clips
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # a pull request's merge into main and main itself, its first parent, so git can tell what it changes; started
          # by hand, the branch and all of main, to find where the branch leaves main
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Find where it leaves main
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "CHANGED_FROM=HEAD^1" >> "$GITHUB_ENV"
          else
            base=$(git merge-base origin/main HEAD)
            echo "CHANGED_FROM=$base" >> "$GITHUB_ENV"
          fi
      - run: node tools/clips-check.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
