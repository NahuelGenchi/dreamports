name: Linux, Mac and Windows (Nintendo DS)

# The Nintendo DS's tools on the three kinds of computer a contributor has: on Linux with what GitHub's runner has, on a
# Mac with Apple's chip, set up as Getting ready says, with Apple's command line tools and Homebrew's Node.js and CMake,
# and on Windows with only git and Node.js, where the tools get their own compiler and CMake. Each builds melonDS from
# its makers' source at the commit tools/consoles.mjs fixes, with the tools' own front, and runs npm run test:real-nds:
# a made-up program's two screens, its buttons, its touches and its sound, the same on all three by a hash the test
# keeps (docs/CONSOLES.md#the-nintendo-ds), and npm run test:nds-twin, the function check, with the original in melonDS's own
# processors and a made-up cartridge's twins in C, and npm run test:nds-flow, a made-up game taken through the new way of
# making one, a part at a time, from proofs --start --parts to a part done, with a stand-in for GitHub, and
# npm run test:nds-kit, the kit in C's pieces proven against melonDS with programs of the project's own. Nothing from any game's copy is needed, and nothing is sent anywhere.
#
# It isn't part of Check, as the emulator takes minutes to build. It runs on pull requests that touch what those tools
# are made of, after they merge, every week, so the newest systems GitHub has try it too, and by hand.
on:
  pull_request:
    paths:
      - '.github/workflows/nds.yml'
      - 'kit/consoles.js'
      - 'kit/nds/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/consoles.mjs'
      - 'tools/gba/thumb.mjs'
      - 'tools/gba/windows.mjs'
      - 'tools/lib/**'
      - 'tools/libretro/build.mjs'
      - 'tools/libretro/host.c'
      - 'tools/libretro/*.h'
      - 'tools/libretro/melonds.patch'
      - 'tools/libretro/reference.mjs'
      - 'tools/nds/**'
      - 'tools/test/made-up-nds*'
      - 'tools/test/real-nds.mjs'
      - 'tools/test/nds-twin.mjs'
      - 'tools/test/nds-twin/**'
      - 'tools/test/nds-flow.mjs'
      - 'tools/test/nds-flow/**'
      - 'tools/test/nds-kit.mjs'
      - 'tools/test/nds-kit/**'
      - 'tools/*.mjs'
      - 'src/lib/systems.ts'
      - 'public/systems/nds.svg'
      - 'tools/twin.mjs'
      - 'tools/proofs.mjs'
      - 'tools/gba/twin.mjs'
      - 'tools/gba/match.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nds.yml'
      - 'kit/consoles.js'
      - 'kit/nds/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/consoles.mjs'
      - 'tools/gba/thumb.mjs'
      - 'tools/gba/windows.mjs'
      - 'tools/lib/**'
      - 'tools/libretro/build.mjs'
      - 'tools/libretro/host.c'
      - 'tools/libretro/*.h'
      - 'tools/libretro/melonds.patch'
      - 'tools/libretro/reference.mjs'
      - 'tools/nds/**'
      - 'tools/test/made-up-nds*'
      - 'tools/test/real-nds.mjs'
      - 'tools/test/nds-twin.mjs'
      - 'tools/test/nds-twin/**'
      - 'tools/test/nds-flow.mjs'
      - 'tools/test/nds-flow/**'
      - 'tools/test/nds-kit.mjs'
      - 'tools/test/nds-kit/**'
      - 'tools/*.mjs'
      - 'src/lib/systems.ts'
      - 'public/systems/nds.svg'
      - 'tools/twin.mjs'
      - 'tools/proofs.mjs'
      - 'tools/gba/twin.mjs'
      - 'tools/gba/match.mjs'
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Nintendo DS)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run test:real-nds
      - run: npm run test:nds-twin
      - run: npm run test:nds-flow
      - run: npm run test:nds-kit

  mac:
    name: Mac (Nintendo DS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Mac has or installs: Apple's command line tools give git and the compiler, and Homebrew gives
      # Node.js and CMake
      - name: Getting ready on a Mac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          cc --version | head -1
          brew install --quiet node cmake
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cmake --version | head -1
      - name: The tools' packages
        run: |
          node --version
          npm ci
      - run: npm run test:real-nds
      - run: npm run test:nds-twin
      - run: npm run test:nds-flow
      - run: npm run test:nds-kit

  windows:
    name: Windows (Nintendo DS)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Windows has or installs: git and Node.js. The tools get the compiler and CMake themselves
      # (tools/gba/windows.mjs)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run test:real-nds
      - run: npm run test:nds-twin
      - run: npm run test:nds-flow
      - run: npm run test:nds-kit
