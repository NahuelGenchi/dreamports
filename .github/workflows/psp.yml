  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fails a pull request that one above it in a stack carries, so none of the jobs after it starts (.github/stack/stack.mjs)
  stack:
    name: Stack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/stack
      - name: Stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/stack/stack.mjs

  linux:
    name: Linux (PlayStation Portable)
    needs: stack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      # OpenGL's headers, which PPSSPP's source includes whatever it draws with
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libgl-dev libegl-dev libgles-dev
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'schedule'
        with:
          path: .dreamports/libretro/ppsspp_libretro-*.so
          key: ppsspp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/consoles.mjs', 'tools/libretro/ppsspp.patch', 'tools/libretro/build.mjs') }}
      - run: npm run dp -- setup psp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: .dreamports/libretro/ppsspp_libretro-*.so
          key: ppsspp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/consoles.mjs', 'tools/libretro/ppsspp.patch', 'tools/libretro/build.mjs') }}
      - run: npm run test:real-psp -- --write psp-same-linux.json
      # the kit in C, proven against the emulator in the computer's own browser
      - run: npm run test:psp-kit
      # the function check: the original's functions run in PPSSPP's own interpreter beside their twins
      - run: npm run test:psp-twin
      # the whole new way, from proofs --start --parts to a part done, with a stand-in for GitHub
      - run: npm run test:psp-parts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psp-same-linux
          path: psp-same-linux.json
          retention-days: 7

  mac:
    name: Mac (PlayStation Portable)
    needs: stack
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Mac has or installs: Apple's command line tools give git and the C compiler, Homebrew gives
      # Node.js, the GitHub CLI and CMake
      - name: Getting ready on a Mac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          xcode-select -p
          cc --version | head -1
          brew install --quiet node gh cmake
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          cmake --version | head -1
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'schedule'
        with:
          path: .dreamports/libretro/ppsspp_libretro-*.dylib
          key: ppsspp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/consoles.mjs', 'tools/libretro/ppsspp.patch', 'tools/libretro/build.mjs') }}
      - name: PPSSPP, built for arm64
        run: |
          npm run dp -- setup psp
          file .dreamports/libretro/ppsspp_libretro-*.dylib .dreamports/libretro/host
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: .dreamports/libretro/ppsspp_libretro-*.dylib
          key: ppsspp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/consoles.mjs', 'tools/libretro/ppsspp.patch', 'tools/libretro/build.mjs') }}
      - run: npm run test:real-psp -- --write psp-same-mac.json
      # the kit in C, proven against the emulator in the computer's own browser
      - run: npm run test:psp-kit
      # the function check: the original's functions run in PPSSPP's own interpreter beside their twins
      - run: npm run test:psp-twin
      # the whole new way, from proofs --start --parts to a part done, with a stand-in for GitHub
      - run: npm run test:psp-parts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psp-same-mac
          path: psp-same-mac.json
          retention-days: 7

  windows:
    name: Windows (PlayStation Portable)
    needs: stack
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # Git on GitHub's Windows machines writes CRLF where a file has no rule of its own, as in the scratch repositories
      # the tools' tests make, which then don't read back as they were written
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # what a person's Windows has or installs: git and Node.js. setup gets the compiler and CMake itself
      # (tools/gba/windows.mjs)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'schedule'
        with:
          path: .dreamports/libretro/ppsspp_libretro-*.dll
          key: ppsspp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/consoles.mjs', 'tools/libretro/ppsspp.patch', 'tools/libretro/build.mjs', 'tools/gba/windows.mjs') }}
      - run: npm run dp -- setup psp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: .dreamports/libretro/ppsspp_libretro-*.dll
          key: ppsspp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/consoles.mjs', 'tools/libretro/ppsspp.patch', 'tools/libretro/build.mjs', 'tools/gba/windows.mjs') }}
      - run: npm run test:real-psp -- --write psp-same-windows.json
      # the kit in C, proven against the emulator in the computer's own browser
      - run: npm run test:psp-kit
      # the function check: the original's functions run in PPSSPP's own interpreter beside their twins
      - run: npm run test:psp-twin
      # the whole new way, from proofs --start --parts to a part done, with a stand-in for GitHub
      - run: npm run test:psp-parts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psp-same-windows
          path: psp-same-windows.json
          retention-days: 7

  same:
    name: Same on Linux, a Mac and Windows (PlayStation Portable)
    needs: [stack, linux, mac, windows]
    if: ${{ !cancelled() && needs.stack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: psp-same-*
          merge-multiple: true
      - run: node tools/test/real-psp.mjs --compare psp-same-linux.json psp-same-mac.json psp-same-windows.json
