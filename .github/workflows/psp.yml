      - 'tools/consoles.mjs'
      - 'tools/dp.mjs'
      - 'tools/find.mjs'
      - 'tools/gba/**'
      - 'tools/lib/binaryen.mjs'
      - 'tools/lib/c.mjs'
      - 'tools/lib/chrome.mjs'
