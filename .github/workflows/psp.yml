  push:
    branches: [main]
    paths:
      - '.github/workflows/psp.yml'
      - '.node-version'
      - '.npmrc'
      - 'kit/c/console.c'
      - 'kit/c/disc.c'
      - 'kit/c/disc.h'
      - 'kit/c/game.js'
      - 'kit/c/kit.c'
      - 'kit/c/kit.h'
      - 'kit/c/libc.c'
      - 'kit/c/native.c'
      - 'kit/c/page.h'
      - 'kit/c/pause.c'
      - 'kit/c/worklet.js'
      - 'kit/consoles.js'
      - 'kit/psp/**'
      - 'package-lock.json'
      - 'package.json'
      - 'public/systems/psp.svg'
      - 'tools/codemap.mjs'
      - 'tools/consoles.mjs'
      - 'tools/dp.mjs'
      - 'tools/find.mjs'
      - 'tools/gba/**'
      - 'tools/lib/binaryen.mjs'
      - 'tools/lib/c.mjs'
      - 'tools/lib/chrome.mjs'
      - 'tools/lib/explore.h'
