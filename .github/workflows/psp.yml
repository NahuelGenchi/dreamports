      - 'tools/libretro/host.c'
      - 'tools/libretro/new-game/**'
      - 'tools/libretro/ppsspp.patch'
      - 'tools/libretro/ran-ps2.h'
      - 'tools/libretro/ran.h'
      - 'tools/libretro/reference.mjs'
      - 'tools/libretro/starts.h'
      - 'tools/new.mjs'
      - 'tools/proofs.mjs'
      - 'tools/prove.mjs'
      - 'tools/ps2/twin.mjs'
      - 'tools/psp/**'
      - 'tools/ready.mjs'
      - 'tools/rom.mjs'
      - 'tools/setup.mjs'
      - 'tools/tasks.mjs'
      - 'tools/test/made-up-psp-disc.mjs'
      - 'tools/test/made-up-psp-ge.mjs'
      - 'tools/test/made-up-psp-mutex.mjs'
      - 'tools/test/made-up-psp-sync.mjs'
      - 'tools/test/made-up-psp-twin.mjs'
      - 'tools/test/made-up-psp-vfpu.mjs'
      - 'tools/test/made-up-psp.mjs'
      - 'tools/test/parts-flow.mjs'
      - 'tools/test/psp-ge.mjs'
      - 'tools/test/psp-ge/**'
      - 'tools/test/psp-kit.mjs'
      - 'tools/test/psp-kit/**'
      - 'tools/test/psp-mutex.mjs'
      - 'tools/test/psp-mutex/**'
      - 'tools/test/psp-parts.mjs'
      - 'tools/test/psp-parts/**'
      - 'tools/test/psp-sync.mjs'
      - 'tools/test/psp-sync/**'
      - 'tools/test/psp-twin.mjs'
      - 'tools/test/psp-twin/**'
      - 'tools/test/psp-vfpu.mjs'
      - 'tools/test/psp-vfpu/**'
      - 'tools/test/real-psp.mjs'
      - 'tools/test/stand-in/**'
